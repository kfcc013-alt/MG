<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>업무 FAQ 검색 도우미</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Inter & Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        /* Custom styling for keyword highlighting */
        mark {
            background-color: #fef08a; /* Tailwind yellow-200 */
            color: #854d0e; /* Tailwind yellow-800 */
            font-weight: 600;
            padding: 0.1rem 0.2rem;
            border-radius: 0.25rem;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Main Container -->
    <div class="max-w-4xl mx-auto px-4 pt-8 md:pt-12">
        
        <!-- Header -->
        <header class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 bg-indigo-600 text-white rounded-2xl shadow-lg mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                </svg>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-slate-900 tracking-tight">업무 FAQ 검색</h1>
            <p class="text-slate-500 mt-2 text-sm md:text-base">자주 묻는 업무 질문을 빠르고 정확하게 찾아보세요.</p>
        </header>

        <!-- Search & Filter Card -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 md:p-6 mb-6">
            
            <!-- Search Bar Input -->
            <div class="relative mb-5">
                <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
                <input 
                    type="text" 
                    id="searchInput"
                    class="w-full pl-11 pr-10 py-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all text-slate-800 placeholder-slate-400 font-medium"
                    placeholder="질문이나 키워드를 입력하세요. (예: 신청, 보안, 사내)"
                />
                <button 
                    id="clearSearchBtn" 
                    class="hidden absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 transition-colors"
                    title="검색어 지우기"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>

            <!-- Category Filter Buttons -->
            <div>
                <span class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">분류 필터</span>
                <div class="flex flex-wrap gap-2" id="categoryContainer">
                    <!-- Dynamic categories injected by JS -->
                </div>
            </div>
        </div>

        <!-- Search Status Bar & Clear Button -->
        <div class="flex items-center justify-between mb-4 px-1">
            <div id="resultCount" class="text-sm font-medium text-slate-600">
                <!-- Result count text -->
            </div>
            <button 
                id="resetAllBtn"
                class="inline-flex items-center text-xs font-semibold text-indigo-600 hover:text-indigo-800 hover:underline transition-all"
            >
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                전체보기 (초기화)
            </button>
        </div>

        <!-- FAQ Results Container -->
        <div id="faqList" class="space-y-4">
            <!-- FAQ items will be rendered here dynamically -->
        </div>

    </div>

    <script>
        // 1. Provided JSON FAQ Data (Strictly specified data only)
        const rawFaqData = [
            {
                "category": "교육",
                "question": "교육 신청은 어디에서 하나요?",
                "answer_seed": "교육 포털의 과정 검색 후 신청 메뉴를 사용합니다."
            },
            {
                "category": "교육",
                "question": "신청한 교육을 취소하려면 어떻게 하나요?",
                "answer_seed": "신청내역에서 취소 가능 여부를 확인합니다."
            },
            {
                "category": "문서",
                "question": "주간 업무보고에는 무엇을 넣어야 하나요?",
                "answer_seed": "주요 실적, 이슈, 다음 주 계획을 중심으로 작성합니다."
            },
            {
                "category": "IT",
                "question": "사내 시스템 접속이 되지 않습니다.",
                "answer_seed": "네트워크, 브라우저, 계정 상태를 순서대로 확인합니다."
            },
            {
                "category": "보안",
                "question": "ChatGPT에 내부 업무자료를 넣어도 되나요?",
                "answer_seed": "교육에서는 합성자료를 사용하고, 실제 자료는 조직의 보안 및 AI 사용 기준을 먼저 확인합니다."
            }
        ];

        // Categories list
        const categories = ["전체", "교육", "문서", "IT", "보안"];

        // Color badge mappings per category
        const categoryColors = {
            "교육": "bg-blue-50 text-blue-700 border-blue-200",
            "문서": "bg-emerald-50 text-emerald-700 border-emerald-200",
            "IT": "bg-purple-50 text-purple-700 border-purple-200",
            "보안": "bg-rose-50 text-rose-700 border-rose-200"
        };

        // State variables
        let selectedCategory = "전체";
        let searchQuery = "";

        // DOM elements
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const categoryContainer = document.getElementById('categoryContainer');
        const faqList = document.getElementById('faqList');
        const resultCount = document.getElementById('resultCount');
        const resetAllBtn = document.getElementById('resetAllBtn');

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            renderFAQList();

            // Event Listeners
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.trim();
                toggleClearButton();
                renderFAQList();
            });

            clearSearchBtn.addEventListener('click', () => {
                searchInput.value = '';
                searchQuery = '';
                toggleClearButton();
                searchInput.focus();
                renderFAQList();
            });

            resetAllBtn.addEventListener('click', resetFilters);
        });

        // Toggle clear button visibility in input
        function toggleClearButton() {
            if (searchInput.value.length > 0) {
                clearSearchBtn.classList.remove('hidden');
            } else {
                clearSearchBtn.classList.add('hidden');
            }
        }

        // Reset all filters and search keyword
        function resetFilters() {
            selectedCategory = "전체";
            searchQuery = "";
            searchInput.value = "";
            toggleClearButton();
            renderCategories();
            renderFAQList();
        }

        // Render Category Filter Buttons
        function renderCategories() {
            categoryContainer.innerHTML = categories.map(cat => {
                const isActive = cat === selectedCategory;
                const activeClass = isActive 
                    ? "bg-slate-900 text-white shadow-sm ring-2 ring-slate-900" 
                    : "bg-slate-100 text-slate-600 hover:bg-slate-200 border-transparent";
                
                return `
                    <button 
                        onclick="selectCategory('${cat}')"
                        class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition-all ${activeClass}"
                    >
                        ${cat}
                    </button>
                `;
            }).join('');
        }

        // Select Category handler
        window.selectCategory = function(category) {
            selectedCategory = category;
            renderCategories();
            renderFAQList();
        };

        // Escape regex special characters
        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        // Highlight matching search terms
        function highlightText(text, query) {
            if (!query) return text;
            const escapedQuery = escapeRegExp(query);
            const regex = new RegExp(`(${escapedQuery})`, 'gi');
            return text.replace(regex, '<mark>$1</mark>');
        }

        // Render FAQ Results List
        function renderFAQList() {
            // Filter data by category and keyword
            const filteredData = rawFaqData.filter(item => {
                const matchesCategory = (selectedCategory === "전체") || (item.category === selectedCategory);
                
                const queryLower = searchQuery.toLowerCase();
                const matchesSearch = !searchQuery || 
                    item.question.toLowerCase().includes(queryLower) || 
                    item.answer_seed.toLowerCase().includes(queryLower);

                return matchesCategory && matchesSearch;
            });

            // Render result count
            resultCount.innerHTML = `총 <span class="font-bold text-indigo-600">${filteredData.length}</span>건의 검색 결과`;

            // If no results found
            if (filteredData.length === 0) {
                faqList.innerHTML = `
                    <div class="bg-white rounded-2xl border border-slate-200 p-10 text-center">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-slate-100 text-slate-500 mb-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                        </div>
                        <h3 class="text-base font-bold text-slate-800">등록된 FAQ에서 답변을 찾을 수 없습니다.</h3>
                        <p class="text-sm text-slate-500 mt-1.5 mb-4">관련 담당부서 또는 공식 안내자료를 확인해 주세요.</p>
                        <button 
                            onclick="resetFilters()"
                            class="px-4 py-2 bg-indigo-50 text-indigo-600 hover:bg-indigo-100 text-xs font-semibold rounded-lg transition-colors"
                        >
                            전체 FAQ 보기
                        </button>
                    </div>
                `;
                return;
            }

            // Render FAQ Card Elements
            faqList.innerHTML = filteredData.map(item => {
                const highlightedQuestion = highlightText(item.question, searchQuery);
                const highlightedAnswer = highlightText(item.answer_seed, searchQuery);
                const badgeColor = categoryColors[item.category] || "bg-slate-100 text-slate-700 border-slate-200";

                return `
                    <div class="bg-white rounded-2xl border border-slate-200 hover:border-slate-300 p-5 md:p-6 transition-all shadow-sm hover:shadow-md">
                        <!-- Header with Category Tag -->
                        <div class="flex items-center justify-between mb-3">
                            <span class="inline-block px-2.5 py-0.5 text-xs font-semibold rounded-md border ${badgeColor}">
                                ${item.category}
                            </span>
                        </div>

                        <!-- Question -->
                        <div class="flex items-start gap-3 mb-3">
                            <span class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-indigo-100 text-indigo-700 font-bold text-xs">
                                Q
                            </span>
                            <h2 class="text-base md:text-lg font-bold text-slate-900 leading-snug">
                                ${highlightedQuestion}
                            </h2>
                        </div>

                        <!-- Answer -->
                        <div class="flex items-start gap-3 pt-3 border-t border-slate-100">
                            <span class="flex-shrink-0 flex items-center justify-center w-6 h-6 rounded-full bg-slate-100 text-slate-600 font-bold text-xs">
                                A
                            </span>
                            <p class="text-sm md:text-base text-slate-600 leading-relaxed pt-0.5">
                                ${highlightedAnswer}
                            </p>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
